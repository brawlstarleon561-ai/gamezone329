<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameZone - Actus Jeux Vidéo</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="header">
        <h1 class="logo">GameZone</h1>
        <nav class="nav">
            <a href="#actus">Actualités</a>
            <a href="#jeux">Jeux gratuits</a>
            <a href="#reviews">Reviews</a>
            <a href="#trailers">Trailers</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Les dernières actus gaming</h2>
        <p>Retrouvez les nouveautés, leaks, tests et trailers.</p>
    </section>

    <section id="actus" class="cards-section">
        <h2>Actualités</h2>
        <div class="cards" id="news-container"></div>
    </section>

    <section id="jeux" class="cards-section">
        <h2>Jeux gratuits</h2>
        <div class="cards">
            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/en/6/6d/Legend_of_Zelda_logo.svg" />
                <h3>Zelda (fan-games)</h3>
                <a href="https://zelda-fan-game.com" target="_blank">Jouer</a>
            </div>

            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png" />
                <h3>Minecraft Classic</h3>
                <a href="https://classic.minecraft.net" target="_blank">Jouer</a>
            </div>

            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/en/8/8c/The_Baby_in_Yellow_Cover.jpg" />
                <h3>Baby in Yellow</h3>
                <a href="https://oculusdb.rui2015.me/webgamelist/baby-in-yellow" target="_blank">Jouer</a>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>© 2025 GameZone - Inspiré de Game3rb</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
